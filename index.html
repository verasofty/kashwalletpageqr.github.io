<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KASH Wallet - Redirección</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    // Configuración completa para KASH Wallet
    const appConfig = {
      android: {
        appScheme: 'kashwallet://inicio',
        intentUrl: 'intent://inicio#Intent;scheme=kashwallet;package=onsigna.wallet.kashpay;end;',
        storeUrl: 'https://play.google.com/store/apps/details?id=onsigna.wallet.kashpay&hl=es_419'
      },
      ios: {
        appScheme: 'kashwallet://inicio',
        universalLink: 'https://kashpay.com/inicio',
        itunesUrl: 'itms-apps://itunes.apple.com/app/id6443642308',
        webStoreUrl: 'https://apps.apple.com/mx/app/kash-wallet/id6443642308'
      },
      fallbackUrl: 'https://onsigna.com',
      timeout: 1000
    };

    // Detectar plataforma
    function detectPlatform() {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      if (/android/i.test(userAgent)) return 'android';
      if (/iPad|iPhone|iPod/i.test(userAgent) && !window.MSStream) return 'ios';
      return 'other';
    }

    // Redirección para Android
    function launchAndroid() {
      // Método 1: Intent explícito
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = appConfig.android.intentUrl;
      document.body.appendChild(iframe);
      
      // Método 2: Fallback a Play Store
      setTimeout(() => {
        window.location.href = appConfig.android.storeUrl;
      }, appConfig.timeout);
    }

    // Redirección para iOS (mejorada)
    function launchIOS() {
      // 1. Intenta Universal Link (si está configurado)
      window.location.href = appConfig.ios.universalLink;
      
      // 2. Fallback a custom scheme
      setTimeout(() => {
        window.location = appConfig.ios.appScheme;
        
        // 3. Último fallback: App Store directa
        setTimeout(() => {
          window.location.href = appConfig.ios.itunesUrl;
        }, appConfig.timeout);
      }, 300);
    }

    // Manejar clic del usuario (requerido para iOS)
    function handleUserInteraction() {
      sessionStorage.setItem('userInteracted', 'true');
      const platform = detectPlatform();
      
      if (platform === 'android') {
        launchAndroid();
      } else if (platform === 'ios') {
        launchIOS();
      } else {
        window.location.href = appConfig.fallbackUrl;
      }
    }

    // Iniciar automáticamente solo si hubo interacción previa
    window.onload = function() {
      if (sessionStorage.getItem('userInteracted')) {
        const platform = detectPlatform();
        if (platform === 'android') launchAndroid();
        if (platform === 'ios') launchIOS();
      }
    };
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f5f5f5;
      color: #333;
      max-width: 600px;
      margin: 0 auto;
    }
    .logo {
      width: 100px;
      height: 100px;
      margin-bottom: 20px;
      border-radius: 20px;
    }
    .btn-open {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 18px;
      border-radius: 30px;
      cursor: pointer;
      margin: 20px 0;
      transition: background-color 0.3s;
    }
    .btn-open:hover {
      background-color: #45a049;
    }
    .loading {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 5px solid rgba(0,0,0,0.1);
      border-radius: 50%;
      border-top-color: #4CAF50;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading"></div>
  <h1>KASH Wallet</h1>
  <p>La billetera digital más segura</p>
  
  <button class="btn-open" onclick="handleUserInteraction()">
    Abrir KASH Wallet
  </button>
  
  <p>Si no tienes la app instalada, serás redirigido a la tienda</p>
  
  <script>
    // Ocultar loading después de 3 segundos (solo para UX)
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
    }, 3000);
  </script>
</body>
</html>
