<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KASH Wallet - Redirección</title>
  <meta name="apple-itunes-app" content="app-id=6443642308, app-argument=kashwallet://inicio">
  <script>
    // Configuración específica para KASH Wallet
    const appConfig = {
      android: {
        appScheme: 'kashwallet://inicio',
        intentUrl: 'intent://inicio#Intent;scheme=kashwallet;package=onsigna.wallet.kashpay;end;',
        storeUrl: 'https://play.google.com/store/apps/details?id=onsigna.wallet.kashpay&hl=es_419'
      },
      ios: {
        appScheme: 'kashwallet://inicio',
        universalLink: 'https://kashpay.com/inicio',
        storeUrl: 'https://apps.apple.com/mx/app/kash-wallet/id6443642308'
      },
      fallbackUrl: 'https://onsigna.com',
      timeout: 2000 // Tiempo de espera aumentado a 2 segundos
    };

    // Detectar el sistema operativo del usuario
    function detectPlatform() {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      if (/android/i.test(userAgent)) return 'android';
      if (/iPad|iPhone|iPod/i.test(userAgent) && !window.MSStream) return 'ios';
      return 'other';
    }

    // Intenta abrir la aplicación con método mejorado
    function launchApp() {
      const platform = detectPlatform();
      let appOpened = false;
      
      // Evento para detectar si la app se abrió
      window.addEventListener('blur', function() {
        appOpened = true;
      });

      if (platform === 'android') {
        // Método mejorado para Android
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = appConfig.android.intentUrl;
        document.body.appendChild(iframe);
        
        setTimeout(function() {
          if (!appOpened) {
            window.location.href = appConfig.android.storeUrl;
          }
        }, appConfig.timeout);
        
      } else if (platform === 'ios') {
        // Método mejorado para iOS
        // 1. Intento con Universal Link
        window.location.href = appConfig.ios.universalLink;
        
        // 2. Fallback con scheme después de 500ms
        setTimeout(function() {
          if (!appOpened) {
            // Intento con window.open (mejor soporte en Safari)
            const opened = window.open(appConfig.ios.appScheme, '_blank');
            
            // 3. Fallback con iframe si window.open falla
            setTimeout(function() {
              if (!appOpened && opened === null) {
                const iframe = document.createElement('iframe');
                iframe.style.display = 'none';
                iframe.src = appConfig.ios.appScheme;
                document.body.appendChild(iframe);
              }
            }, 25);
          }
        }, 500);
        
        // 4. Redirigir a App Store si todo falla
        setTimeout(function() {
          if (!appOpened) {
            window.location.href = appConfig.ios.storeUrl;
          }
        }, appConfig.timeout);
        
      } else {
        window.location.href = appConfig.fallbackUrl;
      }
    }

    // Iniciar la redirección cuando la página cargue
    window.onload = function() {
      setTimeout(launchApp, 100);
    };
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f5f5f5;
      color: #333;
    }
    .loading {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 5px solid rgba(0,0,0,0.1);
      border-radius: 50%;
      border-top-color: #4CAF50;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
    .btn:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="loading"></div>
  <h1>KASH Wallet</h1>
  <p>Redirigiendo a la aplicación...</p>
  <p>Si no se redirige automáticamente, <a href="#" onclick="launchApp(); return false;" class="btn">Abrir KASH Wallet</a></p>
  <p><small>O instala la app desde <a href="https://apps.apple.com/mx/app/kash-wallet/id6443642308" target="_blank">App Store</a> o <a href="https://play.google.com/store/apps/details?id=onsigna.wallet.kashpay&hl=es_419" target="_blank">Google Play</a></small></p>
</body>
</html>
