<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KASH Wallet - Redirección</title>
  <script>
    // Configuración específica para KASH Wallet
    const appConfig = {
      android: {
        appScheme: 'kashwallet://',  // Scheme para Android
        storeUrl: 'https://play.google.com/store/apps/details?id=onsigna.wallet.kashpay&hl=es_419'
      },
      ios: {
        appScheme: 'kashwallet://',  // Scheme para iOS
        storeUrl: 'https://apps.apple.com/mx/app/kash-wallet/id6443642308'
      },
      fallbackUrl: 'https://kashpay.com'  // Cambia esto por tu sitio web si es diferente
    };

    // Detectar el sistema operativo del usuario
    function detectPlatform() {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      
      if (/android/i.test(userAgent)) return 'android';
      if (/iPad|iPhone|iPod/i.test(userAgent) && !window.MSStream) return 'ios';
      return 'other';
    }

    // Intenta abrir la aplicación
    function launchApp(scheme, fallback) {
      // Primero intentamos abrir la app directamente
      window.location.href = scheme;
      
      // Si después de 500ms no se abrió, redirigimos a la tienda
      setTimeout(function() {
        if (!document.hidden) {
          window.location.href = fallback;
        }
      }, 500);
    }

    // Manejar la redirección inteligente
    function smartRedirect() {
      const platform = detectPlatform();
      
      switch(platform) {
        case 'android':
          launchApp(appConfig.android.appScheme, appConfig.android.storeUrl);
          break;
        case 'ios':
          launchApp(appConfig.ios.appScheme, appConfig.ios.storeUrl);
          break;
        default:
          window.location.href = appConfig.fallbackUrl;
      }
    }

    // Iniciar la redirección cuando la página cargue
    window.onload = smartRedirect;
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f5f5f5;
      color: #333;
    }
    .loading {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 5px solid rgba(0,0,0,0.1);
      border-radius: 50%;
      border-top-color: #4CAF50;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading"></div>
  <h1>KASH Wallet</h1>
  <p>Redirigiendo a la aplicación...</p>
  <p>Si no se redirige automáticamente, <a href="#" onclick="smartRedirect()">haz clic aquí</a>.</p>
</body>
</html>
