<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KASH Wallet - Redirección</title>
  <meta name="apple-itunes-app" content="app-id=6443642308, app-argument=kashwallet://inicio">
  <script>
    // Configuración mejorada para KASH Wallet
    const appConfig = {
      android: {
        intentUrl: 'intent://inicio#Intent;scheme=kashwallet;package=onsigna.wallet.kashpay;end;',
        storeUrl: 'https://play.google.com/store/apps/details?id=onsigna.wallet.kashpay&hl=es_419',
        fallbackDelay: 500
      },
      ios: {
        appScheme: 'kashwallet://inicio',
        universalLink: 'https://kashpay.com/inicio',
        storeUrl: 'https://apps.apple.com/mx/app/kash-wallet/id6443642308',
        fallbackDelay: 500
      },
      fallbackUrl: 'https://kashpay.com'
    };

    // Detección mejorada de plataforma
    function detectPlatform() {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      if (/android/i.test(userAgent)) return 'android';
      if (/iPad|iPhone|iPod/i.test(userAgent) && !window.MSStream) return 'ios';
      return 'other';
    }

    // Redirección segura para iOS
    function launchIOS() {
      let timer = null;
      let appLaunched = false;
      
      // Evento para detectar si la app se abrió
      window.addEventListener('blur', () => { appLaunched = true; });
      
      // 1. Intento con Universal Link
      window.location.href = appConfig.ios.universalLink;
      
      // 2. Fallback con URL scheme
      timer = setTimeout(() => {
        if (!appLaunched) {
          // Método seguro que no muestra errores en Safari
          const iframe = document.createElement('iframe');
          iframe.style.display = 'none';
          iframe.src = appConfig.ios.appScheme;
          document.body.appendChild(iframe);
          
          // 3. Redirección final a App Store
          setTimeout(() => {
            if (!appLaunched && iframe.parentNode) {
              document.body.removeChild(iframe);
              window.location.href = appConfig.ios.storeUrl;
            }
          }, appConfig.ios.fallbackDelay);
        }
      }, appConfig.ios.fallbackDelay);
    }

    // Redirección mejorada para Android
    function launchAndroid() {
      let appLaunched = false;
      
      window.addEventListener('blur', () => { appLaunched = true; });
      
      // 1. Intento con Intent URL
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = appConfig.android.intentUrl;
      document.body.appendChild(iframe);
      
      // 2. Fallback a Play Store
      setTimeout(() => {
        if (!appLaunched && iframe.parentNode) {
          document.body.removeChild(iframe);
          window.location.href = appConfig.android.storeUrl;
        }
      }, appConfig.android.fallbackDelay);
    }

    // Función principal de lanzamiento
    function launchApp() {
      const platform = detectPlatform();
      
      if (platform === 'android') {
        launchAndroid();
      } else if (platform === 'ios') {
        launchIOS();
      } else {
        window.location.href = appConfig.fallbackUrl;
      }
    }

    // Inicio controlado
    document.addEventListener('DOMContentLoaded', () => {
      setTimeout(launchApp, 100);
    });
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f5f5f5;
      color: #333;
    }
    .loading {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 5px solid rgba(0,0,0,0.1);
      border-radius: 50%;
      border-top-color: #4CAF50;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }
    .btn:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <div class="loading"></div>
  <h1>KASH Wallet</h1>
  <p>Redirigiendo a la aplicación...</p>
  <p>
    <a href="#" onclick="launchApp(); return false;" class="btn">Abrir KASH Wallet</a>
  </p>
  <p>
    <small>
      Descarga la app desde 
      <a href="https://apps.apple.com/mx/app/kash-wallet/id6443642308" target="_blank" rel="noopener">App Store</a> 
      o 
      <a href="https://play.google.com/store/apps/details?id=onsigna.wallet.kashpay&hl=es_419" target="_blank" rel="noopener">Google Play</a>
    </small>
  </p>
</body>
</html>
