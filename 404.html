<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KASH Wallet - Redirección</title>
  <script>
    // Configuración específica para KASH Wallet
    const appConfig = {
      android: {
        appScheme: 'kashwallet://inicio',  // Scheme para Android (agregué ruta específica)
        intentUrl: 'intent://inicio#Intent;scheme=kashwallet;package=onsigna.wallet.kashpay;end;', // Intent explícito para Android
        storeUrl: 'https://play.google.com/store/apps/details?id=onsigna.wallet.kashpay&hl=es_419'
      },
      ios: {
        appScheme: 'kashwallet://inicio',  // Scheme para iOS
        universalLink: 'https://kashpay.com/inicio', // Universal Link (debes configurarlo en tu app iOS)
        storeUrl: 'https://apps.apple.com/mx/app/kash-wallet/id6443642308'
      },
      fallbackUrl: 'https://kashpay.com',
      timeout: 2000 // Tiempo de espera aumentado a 2 segundos
    };

    // Detectar el sistema operativo del usuario
    function detectPlatform() {
      const userAgent = navigator.userAgent || navigator.vendor || window.opera;
      if (/android/i.test(userAgent)) return 'android';
      if (/iPad|iPhone|iPod/i.test(userAgent) && !window.MSStream) return 'ios';
      return 'other';
    }

    // Intenta abrir la aplicación con método mejorado
    function launchApp() {
      const platform = detectPlatform();
      let appOpened = false;
      
      // Evento para detectar si la app se abrió
      window.addEventListener('blur', function() {
        appOpened = true;
      });

      if (platform === 'android') {
        // Método mejorado para Android
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = appConfig.android.intentUrl;
        document.body.appendChild(iframe);
        
        setTimeout(function() {
          if (!appOpened) {
            window.location.href = appConfig.android.storeUrl;
          }
        }, appConfig.timeout);
        
      } else if (platform === 'ios') {
        // Método mejorado para iOS
        window.location.href = appConfig.ios.universalLink;
        
        setTimeout(function() {
          if (!appOpened) {
            window.location.href = appConfig.ios.storeUrl;
          }
        }, appConfig.timeout);
        
        // Fallback para iOS < 9
        setTimeout(function() {
          if (!appOpened) {
            window.location.href = appConfig.ios.appScheme;
          }
        }, 500);
        
      } else {
        window.location.href = appConfig.fallbackUrl;
      }
    }

    // Iniciar la redirección cuando la página cargue
    window.onload = function() {
      setTimeout(launchApp, 100); // Pequeño retraso para mejor detección
    };
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f5f5f5;
      color: #333;
    }
    .loading {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 5px solid rgba(0,0,0,0.1);
      border-radius: 50%;
      border-top-color: #4CAF50;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading"></div>
  <h1>KASH Wallet</h1>
  <p>Redirigiendo a la aplicación...</p>
  <p>Si no se redirige automáticamente, <a href="#" onclick="launchApp()">haz clic aquí</a>.</p>
</body>
</html>
